# @package _global_
# SPDX-License-Identifier: LicenseRef-SAM
# EfficientSAM3 (RepViT-M1.1 + MobileCLIP-S0 ctx16), base SAM 3 lineage (image).
#
# Identical to configs/sam3/sam3.yaml EXCEPT for the four EfficientSAM3 deltas:
#   1. vision_backbone.trunk  : pe_vitdet.ViT  -> efficientsam3_trunk.EfficientSam3Trunk
#   2. vision_backbone.add_sam2_neck: true -> false  (SINGLE detection neck; the EfficientSAM3
#      checkpoint has only backbone.vision_backbone.convs -- no sam2_convs / interactive_convs)
#   3. text_encoder           : text_encoder.Sam3TextEncoder -> mobileclip_text_encoder.MobileClipTextEncoder
#   4. detector.geometry_encoder: Sam3GeometryEncoder -> null  (the student detector has NO
#      geometry encoder; forward_grounding skips the geometry cls token when it is None)
# The neck (scalp / scale_factors / position_encoding / d_model) and the detector body
# (transformer / dot_prod_scoring / segmentation_head) are byte-identical to sam3.yaml so the
# strict load is exactly the 1107 checkpoint keys (0 missing / 0 unexpected). See
# sam.build_sam._load_efficientsam3_image_checkpoint for the detector-root 3-group remap.

model:
  _target_: sam.models.sam3_predictor.Sam3Predictor

  # --- shared vision encoder (EfficientSAM3 RepViT trunk + single Simple-FPN neck) -----
  vision_encoder:
    _target_: sam.modeling.encoders.perception_encoder.Sam3VisionEncoder
    scalp: 1
    vision_backbone:
      _target_: sam.modeling.encoders.necks.Sam3DualViTDetNeck
      d_model: 256
      scale_factors: [4.0, 2.0, 1.0, 0.5]
      add_sam2_neck: false   # SINGLE detection neck (no sam2_convs); EfficientSAM3 has no tracker
      trunk:
        _target_: sam.modeling.encoders.efficientsam3_trunk.EfficientSam3Trunk
        backbone_type: repvit
        model_name: m1_1
      position_encoding:
        _target_: sam.modeling.position_encoding.PositionEmbeddingSine
        num_pos_feats: 256
        normalize: true
        scale: null
        temperature: 10000
        warmup_cache: false

  # --- text tower (MobileCLIP-S0 transformer + d_model projector) ----------------------
  text_encoder:
    _target_: sam.modeling.text.mobileclip_text_encoder.MobileClipTextEncoder
    variant: MobileCLIP-S0
    context_length: 16
    output_dim: 256
    tokenizer:
      _target_: sam.modeling.text.tokenizer.Sam3Tokenizer

  # --- DETR detector (VL fusion encoder + 200-query set decoder + heads) ---------------
  detector:
    _target_: sam.modeling.decoders.detr_decoder.Sam3DetrDetector
    num_feature_levels: 1
    o2m_mask_predict: true
    supervise_joint_box_scores: false

    transformer:
      _target_: sam.modeling.decoders.detr_decoder.TransformerWrapper
      d_model: 256
      encoder:
        _target_: sam.modeling.decoders.detr_decoder.TransformerEncoderFusion
        num_layers: 6
        d_model: 256
        num_feature_levels: 1
        add_pooled_text_to_img_feat: false
        pool_text_with_mask: true
        layer:
          _target_: sam.modeling.decoders.detr_decoder.TransformerEncoderLayer
          activation: relu
          d_model: 256
          dim_feedforward: 2048
          dropout: 0.1
          pos_enc_at_attn: true
          pos_enc_at_cross_attn_keys: false
          pos_enc_at_cross_attn_queries: false
          pre_norm: true
          self_attention:
            _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
            num_heads: 8
            dropout: 0.1
            embed_dim: 256
            batch_first: true
          cross_attention:
            _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
            num_heads: 8
            dropout: 0.1
            embed_dim: 256
            batch_first: true
      decoder:
        _target_: sam.modeling.decoders.detr_decoder.TransformerDecoder
        d_model: 256
        num_layers: 6
        num_queries: 200
        return_intermediate: true
        box_refine: true
        num_o2m_queries: 0
        dac: true
        boxRPB: log
        dac_use_selfatt_ln: true
        resolution: 1008
        stride: 14
        presence_token: true
        layer:
          _target_: sam.modeling.decoders.detr_decoder.TransformerDecoderLayer
          activation: relu
          d_model: 256
          dim_feedforward: 2048
          dropout: 0.1
          n_heads: 8
          use_text_cross_attention: true
          cross_attention:
            _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
            num_heads: 8
            dropout: 0.1
            embed_dim: 256

    # EfficientSAM3 (non-geo) student detector has NO geometry encoder: the 1107-key checkpoint
    # carries zero geometry params (the geometry encoder is untrained on this checkpoint).
    # Running it untrained only injects a random image-conditioned CLS token that noise-inflates
    # recall (seed-dependent); we omit it for a deterministic, text-only model defined entirely by
    # the official checkpoint. ``forward_grounding`` uses the text prompt directly when this is None.
    # Trained geometry / exemplar prompting lives in the ``*_geo_ft`` (video) variants.
    geometry_encoder: null

    segmentation_head:
      _target_: sam.modeling.decoders.maskformer_segmentation.UniversalSegmentationHead
      hidden_dim: 256
      upsampling_stages: 3
      aux_masks: false
      presence_head: false
      dot_product_scorer: null
      cross_attend_prompt:
        _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
        num_heads: 8
        dropout: 0
        embed_dim: 256
      pixel_decoder:
        _target_: sam.modeling.decoders.maskformer_segmentation.PixelDecoder
        num_upsampling_stages: 3
        interpolation_mode: nearest
        hidden_dim: 256

    dot_prod_scoring:
      _target_: sam.modeling.decoders.detr_decoder.DotProductScoring
      d_model: 256
      d_proj: 256
      prompt_mlp:
        _target_: sam.modeling.decoders.detr_decoder.MLP
        input_dim: 256
        hidden_dim: 2048
        output_dim: 256
        num_layers: 2
        dropout: 0.1
        residual: true
        out_norm:
          _target_: torch.nn.LayerNorm
          normalized_shape: 256
