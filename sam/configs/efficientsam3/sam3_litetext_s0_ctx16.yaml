# @package _global_
# SPDX-License-Identifier: LicenseRef-SAM
# SAM3-LiteText base-lineage VIDEO predictor (MobileCLIP-S0, context-length 16).
#
# Identical to configs/sam3/sam3.yaml EXCEPT for the text_encoder node, which is
# swapped from Sam3TextEncoder (PE text tower, 295 keys) to MobileClipTextEncoder
# (MobileCLIP-S0, ctx16, 111 keys).  ALL other nodes are verbatim:
#   * PE vision encoder (add_sam2_neck: true — tracker uses the SAM 2 pyramid view)
#   * geometry encoder (trained, kept — 76 keys inside the 397-key detector head)
#   * DETR detector body (transformer / dot_prod_scoring / segmentation_head)
#
# Used by build_sam3_video_predictor (reads model.vision_encoder / .text_encoder /
# .detector; tracker is built in Python and is NOT in this config).  The full load is
# 1281 keys strict (464 vision + 111 language + 397 detector head + 309 tracker).
# Checkpoint: Simon7108528/EfficientSAM3  sam3_litetext/sam3_litetext_mobileclip_s0_ctx16.pt

model:
  _target_: sam.models.sam3_predictor.Sam3Predictor

  # --- shared PE vision encoder (ViTDet trunk + dual Simple-FPN neck) ------------------
  vision_encoder:
    _target_: sam.modeling.encoders.perception_encoder.Sam3VisionEncoder
    scalp: 1
    vision_backbone:
      _target_: sam.modeling.encoders.necks.Sam3DualViTDetNeck
      d_model: 256
      scale_factors: [4.0, 2.0, 1.0, 0.5]
      add_sam2_neck: true   # build + load sam2_convs so detector.* loads strict (Task 9 tracker view)
      trunk:
        _target_: sam.modeling.encoders.pe_vitdet.ViT
        img_size: 1008
        pretrain_img_size: 336
        patch_size: 14
        embed_dim: 1024
        depth: 32
        num_heads: 16
        mlp_ratio: 4.625
        norm_layer: LayerNorm
        drop_path_rate: 0.1
        qkv_bias: true
        use_abs_pos: true
        tile_abs_pos: true
        global_att_blocks: [7, 15, 23, 31]
        use_rope: true
        use_interp_rope: true
        window_size: 24
        pretrain_use_cls_token: true
        retain_cls_token: false
        ln_pre: true
        ln_post: false
        return_interm_layers: false
        bias_patch_embed: false
      position_encoding:
        _target_: sam.modeling.position_encoding.PositionEmbeddingSine
        num_pos_feats: 256
        normalize: true
        scale: null
        temperature: 10000
        warmup_cache: false

  # --- text tower (MobileCLIP-S0 transformer + d_model projector) ----------------------
  text_encoder:
    _target_: sam.modeling.text.mobileclip_text_encoder.MobileClipTextEncoder
    variant: MobileCLIP-S0
    context_length: 16
    output_dim: 256
    tokenizer:
      _target_: sam.modeling.text.tokenizer.Sam3Tokenizer

  # --- DETR detector (VL fusion encoder + 200-query set decoder + heads) ---------------
  detector:
    _target_: sam.modeling.decoders.detr_decoder.Sam3DetrDetector
    num_feature_levels: 1
    o2m_mask_predict: true

    transformer:
      _target_: sam.modeling.decoders.detr_decoder.TransformerWrapper
      d_model: 256
      encoder:
        _target_: sam.modeling.decoders.detr_decoder.TransformerEncoderFusion
        num_layers: 6
        d_model: 256
        num_feature_levels: 1
        add_pooled_text_to_img_feat: false
        pool_text_with_mask: true
        layer:
          _target_: sam.modeling.decoders.detr_decoder.TransformerEncoderLayer
          activation: relu
          d_model: 256
          dim_feedforward: 2048
          dropout: 0.1
          pos_enc_at_attn: true
          pos_enc_at_cross_attn_keys: false
          pos_enc_at_cross_attn_queries: false
          pre_norm: true
          self_attention:
            _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
            num_heads: 8
            dropout: 0.1
            embed_dim: 256
            batch_first: true
          cross_attention:
            _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
            num_heads: 8
            dropout: 0.1
            embed_dim: 256
            batch_first: true
      decoder:
        _target_: sam.modeling.decoders.detr_decoder.TransformerDecoder
        d_model: 256
        num_layers: 6
        num_queries: 200
        return_intermediate: true
        box_refine: true
        num_o2m_queries: 0
        dac: true
        boxRPB: log
        dac_use_selfatt_ln: true
        resolution: 1008
        stride: 14
        presence_token: true
        layer:
          _target_: sam.modeling.decoders.detr_decoder.TransformerDecoderLayer
          activation: relu
          d_model: 256
          dim_feedforward: 2048
          dropout: 0.1
          n_heads: 8
          use_text_cross_attention: true
          cross_attention:
            _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
            num_heads: 8
            dropout: 0.1
            embed_dim: 256

    geometry_encoder:
      _target_: sam.modeling.decoders.detr_decoder.Sam3GeometryEncoder
      d_model: 256
      num_layers: 3
      layer:
        _target_: sam.modeling.decoders.detr_decoder.TransformerEncoderLayer
        activation: relu
        d_model: 256
        dim_feedforward: 2048
        dropout: 0.1
        pos_enc_at_attn: false
        pos_enc_at_cross_attn_keys: true
        pos_enc_at_cross_attn_queries: false
        pre_norm: true
        self_attention:
          _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
          num_heads: 8
          dropout: 0.1
          embed_dim: 256
          batch_first: false
        cross_attention:
          _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
          num_heads: 8
          dropout: 0.1
          embed_dim: 256
          batch_first: false

    segmentation_head:
      _target_: sam.modeling.decoders.maskformer_segmentation.UniversalSegmentationHead
      hidden_dim: 256
      upsampling_stages: 3
      aux_masks: false
      presence_head: false
      dot_product_scorer: null
      cross_attend_prompt:
        _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
        num_heads: 8
        dropout: 0
        embed_dim: 256
      pixel_decoder:
        _target_: sam.modeling.decoders.maskformer_segmentation.PixelDecoder
        num_upsampling_stages: 3
        interpolation_mode: nearest
        hidden_dim: 256

    dot_prod_scoring:
      _target_: sam.modeling.decoders.detr_decoder.DotProductScoring
      d_model: 256
      d_proj: 256
      prompt_mlp:
        _target_: sam.modeling.decoders.detr_decoder.MLP
        input_dim: 256
        hidden_dim: 2048
        output_dim: 256
        num_layers: 2
        dropout: 0.1
        residual: true
        out_norm:
          _target_: torch.nn.LayerNorm
          normalized_shape: 256
