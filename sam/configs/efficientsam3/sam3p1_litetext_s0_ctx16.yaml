# @package _global_
# SPDX-License-Identifier: LicenseRef-SAM
# SAM3.1-LiteText MULTIPLEX VIDEO predictor (MobileCLIP-S0, context-length 16).
#
# Clone of configs/sam3/sam3.1.yaml with ONLY the text_encoder node swapped from
# Sam3TextEncoder (PE text tower, 295 keys) to MobileClipTextEncoder (MobileCLIP-S0,
# ctx16, 111 keys).  ALL other nodes are verbatim:
#   * geometry encoder (trained, kept — 76 keys inside the 397-key detector head)
#   * DETR detector body incl. supervise_joint_box_scores=true (SAM 3.1 joint box score)
#
# Consumed by build_sam3_multiplex_video_predictor, which reads ONLY model.text_encoder +
# model.detector and builds the tri-neck vision encoder + 457 multiplex tracker directly in
# Python. There is therefore no vision_encoder node and no predictor `_target_` here (both
# would be present-but-unused).
# Strict load = 1439 keys: vision 474 + MobileCLIP 111 + detector head 397 + tracker 457
# (0 missing / 0 unexpected).
# Checkpoint: Simon7108528/EfficientSAM3 (public, no token)
#   sam3p1_litetext/efficient_sam3p1_litetext_mobileclip_s0_ctx16.pt

model:
  # NOTE: no predictor `_target_` and no `vision_encoder` node — build_sam3_multiplex_video_predictor
  # reads ONLY model.text_encoder + model.detector and builds the tri-neck vision encoder +
  # 457-key multiplex tracker in Python.

  # --- text tower (MobileCLIP-S0 transformer + d_model projector) ----------------------
  text_encoder:
    _target_: sam.modeling.text.mobileclip_text_encoder.MobileClipTextEncoder
    variant: MobileCLIP-S0
    context_length: 16
    output_dim: 256
    tokenizer:
      _target_: sam.modeling.text.tokenizer.Sam3Tokenizer

  # --- DETR detector — identical arch to base + supervise_joint_box_scores=true ---------
  detector:
    _target_: sam.modeling.decoders.detr_decoder.Sam3DetrDetector
    num_feature_levels: 1
    o2m_mask_predict: true
    supervise_joint_box_scores: true

    transformer:
      _target_: sam.modeling.decoders.detr_decoder.TransformerWrapper
      d_model: 256
      encoder:
        _target_: sam.modeling.decoders.detr_decoder.TransformerEncoderFusion
        num_layers: 6
        d_model: 256
        num_feature_levels: 1
        add_pooled_text_to_img_feat: false
        pool_text_with_mask: true
        layer:
          _target_: sam.modeling.decoders.detr_decoder.TransformerEncoderLayer
          activation: relu
          d_model: 256
          dim_feedforward: 2048
          dropout: 0.1
          pos_enc_at_attn: true
          pos_enc_at_cross_attn_keys: false
          pos_enc_at_cross_attn_queries: false
          pre_norm: true
          self_attention:
            _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
            num_heads: 8
            dropout: 0.1
            embed_dim: 256
            batch_first: true
          cross_attention:
            _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
            num_heads: 8
            dropout: 0.1
            embed_dim: 256
            batch_first: true
      decoder:
        _target_: sam.modeling.decoders.detr_decoder.TransformerDecoder
        d_model: 256
        num_layers: 6
        num_queries: 200
        return_intermediate: true
        box_refine: true
        num_o2m_queries: 0
        dac: true
        boxRPB: log
        dac_use_selfatt_ln: true
        resolution: 1008
        stride: 14
        presence_token: true
        layer:
          _target_: sam.modeling.decoders.detr_decoder.TransformerDecoderLayer
          activation: relu
          d_model: 256
          dim_feedforward: 2048
          dropout: 0.1
          n_heads: 8
          use_text_cross_attention: true
          cross_attention:
            _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
            num_heads: 8
            dropout: 0.1
            embed_dim: 256

    geometry_encoder:
      _target_: sam.modeling.decoders.detr_decoder.Sam3GeometryEncoder
      d_model: 256
      num_layers: 3
      layer:
        _target_: sam.modeling.decoders.detr_decoder.TransformerEncoderLayer
        activation: relu
        d_model: 256
        dim_feedforward: 2048
        dropout: 0.1
        pos_enc_at_attn: false
        pos_enc_at_cross_attn_keys: true
        pos_enc_at_cross_attn_queries: false
        pre_norm: true
        self_attention:
          _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
          num_heads: 8
          dropout: 0.1
          embed_dim: 256
          batch_first: false
        cross_attention:
          _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
          num_heads: 8
          dropout: 0.1
          embed_dim: 256
          batch_first: false

    segmentation_head:
      _target_: sam.modeling.decoders.maskformer_segmentation.UniversalSegmentationHead
      hidden_dim: 256
      upsampling_stages: 3
      aux_masks: false
      presence_head: false
      dot_product_scorer: null
      cross_attend_prompt:
        _target_: sam.modeling.decoders.detr_decoder.MultiheadAttention
        num_heads: 8
        dropout: 0
        embed_dim: 256
      pixel_decoder:
        _target_: sam.modeling.decoders.maskformer_segmentation.PixelDecoder
        num_upsampling_stages: 3
        interpolation_mode: nearest
        hidden_dim: 256

    dot_prod_scoring:
      _target_: sam.modeling.decoders.detr_decoder.DotProductScoring
      d_model: 256
      d_proj: 256
      prompt_mlp:
        _target_: sam.modeling.decoders.detr_decoder.MLP
        input_dim: 256
        hidden_dim: 2048
        output_dim: 256
        num_layers: 2
        dropout: 0.1
        residual: true
        out_norm:
          _target_: torch.nn.LayerNorm
          normalized_shape: 256
