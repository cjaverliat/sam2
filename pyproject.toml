[build-system]
requires = ["scikit-build-core>=0.8.0", "torch>=2.5.1", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "sam2"
dynamic = ["version"]
description = "SAM 2: Segment Anything in Images and Videos"
readme = "README.md"
requires-python = ">=3.10.0"
license = {text = "Apache 2.0"}
authors = [
    {name = "Meta AI", email = "segment-anything@meta.com"},
]
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "numpy>=1.24.4",
    "tqdm>=4.66.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "pillow>=9.4.0",
]
[project.urls]
Homepage = "https://github.com/facebookresearch/sam2"

[project.optional-dependencies]
notebooks = [
    "matplotlib>=3.9.1",
    "jupyter>=1.0.0",
    "opencv-python>=4.7.0",
    "eva-decord>=0.6.1",
]
interactive-demo = [
    "Flask>=3.0.3",
    "Flask-Cors>=5.0.0",
    "av>=13.0.0",
    "dataclasses-json>=0.6.7",
    "eva-decord>=0.6.1",
    "gunicorn>=23.0.0",
    "imagesize>=1.4.1",
    "pycocotools>=2.0.8",
    "strawberry-graphql>=0.243.0",
]
dev = [
    "black==24.2.0",
    "usort==1.0.2",
    "ufmt==2.0.0b2",
    "fvcore>=0.1.5.post20221221",
    "pandas>=2.2.2",
    "scikit-image>=0.24.0",
    "tensorboard>=2.17.0",
    "pycocotools>=2.0.8",
    "tensordict>=0.6.0",
    "opencv-python>=4.7.0",
    "submitit>=1.5.1",
]

[tool.scikit-build]
wheel.packages = ["sam2"]
wheel.exclude = ["notebooks"]

# Force Ninja generator (bypasses MSBuild) and explicitly use Pixi's nvcc
cmake.args = [
    "-G", "Ninja",
    "-DCMAKE_CUDA_COMPILER=nvcc"
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "sam2/version.py"
regex = '''(?smx)
^__version__\s*=\s*['"](?P<version>[^'"]+)['"]
.*?
^__suffix__\s*=\s*['"](?P<suffix>[^'"]*)['"]
'''
result = "{version}{suffix}"

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64", "win-64"]

[tool.pixi.system-requirements]
cuda = "12.8"

[tool.pixi.dependencies]
cuda-version = "12.8.*"
cuda-nvcc = "*"
cuda-libraries-dev = "*"
cuda-cudart-dev = "*"
python = ">=3.10"
numpy = ">=1.24.4"
cmake = ">=3.21"
ninja = "*"
scikit-build-core = ">=0.8.0"

[tool.pixi.pypi-options]
# Build sam2 against the already-installed cu128 torch (and the env's Python),
# not a fresh CPU torch pulled from default PyPI in an isolated build env.
# The isolated build torch lacks c10/cuda/impl/cuda_cmake_macros.h (CUDA-build-only).
no-build-isolation = ["sam2"]

[tool.pixi.pypi-dependencies]
sam2 = { path = ".", editable = true }

torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu128" }

[tool.pixi.environments]
dev = { features = ["dev"] }
notebooks = { features = ["notebooks"] }
interactive-demo = { features = ["interactive-demo"] }
